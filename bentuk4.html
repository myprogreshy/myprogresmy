<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Vocab Game ULTRA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
background:#e6f9e6;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

.app{
width:100%;
max-width:420px;
height:100%;
background:#fff;
display:flex;
flex-direction:column;
padding:14px;
}

.top-bar{
display:flex;
align-items:center;
gap:10px;
}

.level{
background:#58cc02;
color:white;
padding:6px 12px;
border-radius:14px;
font-weight:800;
}

.xp-bar{
flex:1;
height:12px;
background:#dff5d8;
border-radius:20px;
overflow:hidden;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(90deg,#58cc02,#89e219);
transition:.4s;
}

.score,.streak{
padding:6px 10px;
border-radius:14px;
background:#f1fdf0;
border:2px solid #58cc02;
font-weight:700;
}

.info-table{
width:100%;
margin-top:6px;
border-collapse:collapse;
background:#f1fdf0;
border:2px solid #58cc02;
border-radius:12px;
overflow:hidden;
font-weight:800;
font-size:.9rem;
}

.info-table td{
padding:6px 10px;
}

.quiz-name{color:#58cc02;}
.q-number{text-align:right;}

.card{
flex:1;
background:#f8fff6;
border-radius:26px;
margin:20px 0;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
overflow:hidden;
padding:20px;
}

#question{
font-size:2.5rem;
font-weight:900;
text-align:center;
}

.meaning{
font-size:1.1rem;
font-weight:700;
color:#666;
margin-top:8px;
text-align:center;
}

.answer-wrap{
position:relative;
margin-bottom:10px;
}

.answer-box{
min-height:55px;
border:2px dashed #58cc02;
border-radius:14px;
padding:10px;
padding-right:50px;
font-size:1.4rem;
font-weight:800;
text-align:center;
}

#deleteBtn{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:none;
background:transparent;
font-size:1.5rem;
cursor:pointer;
opacity:.45;
transition:.2s;
}

#deleteBtn:hover{
opacity:1;
transform:translateY(-50%) scale(1.15);
}

#options{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
}

#options button{
padding:14px;
font-size:1.2rem;
border:none;
border-radius:16px;
background:#58cc02;
color:white;
font-weight:800;
cursor:pointer;
transition:.15s;
}

#options button:hover{
transform:scale(1.05);
}

#result{
text-align:center;
margin-top:10px;
font-weight:800;
min-height:40px;
}

.badge{
text-align:center;
font-weight:900;
color:#ff9600;
margin-top:6px;
}

.restart{
padding:14px;
border:none;
border-radius:16px;
font-weight:800;
font-size:1rem;
cursor:pointer;
background:#ff9600;
color:white;
}

.result-box{
width:100%;
height:100%;
overflow-y:auto;
padding:20px;
}

.review-table{
width:100%;
border-collapse:collapse;
font-size:.9rem;
}

.review-table th{
background:#58cc02;
color:white;
padding:8px;
}

.review-table td{
padding:8px;
border-bottom:1px solid #eee;
}

.correct{color:#2e7d32;font-weight:700;}
.wrong{color:#c62828;font-weight:700;}
</style>
</head>
<body>

<div class="app">

<div class="top-bar">
<div class="level">XP</div>
<div class="xp-bar"><div id="progressBar"></div></div>
<div class="score" id="score">0 XP</div>
<div class="streak" id="streak">x 0</div>
</div>

<table class="info-table">
<tr>
<td class="quiz-name">Perubahan Bentuk なかった</td>
<td class="q-number" id="qNumber">1 / 7</td>
</tr>
</table>

<div class="card">
<div>
<div id="question">?</div>
<div id="meaning" class="meaning"></div>
</div>
</div>

<div id="result"></div>
<div id="options"></div>
<div class="badge" id="badge"></div>

<button class="restart" id="restartBtn" onclick="start()" style="display:none;">
Mulai Ulang
</button>

</div>

<script>

const vocab=[
  // 第5課 (Bab 5)
  ["いきます", "いかなかった", "Tidak pergi"],
  ["きます", "こなかった", "Tidak datang"],
  ["かえります", "かえらなかった", "Tidak pulang"],

  // 第6課 (Bab 6)
  ["たべます", "たべなかった", "Tidak makan"],
  ["のみます", "のまなかった", "Tidak minum"],
  ["すいます", "すわなかった", "Tidak merokok / tidak menghisap"],
  ["みます", "みなかった", "Tidak melihat / tidak menonton"],
  ["ききます", "きかなかった", "Tidak mendengar / tidak bertanya"],
  ["よみます", "よまなかった", "Tidak membaca"],
  ["かきます", "かかなかった", "Tidak menulis / tidak menggambar"],
  ["かいます", "かわなかった", "Tidak membeli"],
  ["とります", "とらなかった", "Tidak mengambil (foto)"],
  ["します", "しなかった", "Tidak melakukan"],
  ["あいます", "あわなかった", "Tidak bertemu"],

  // 第7課 (Bab 7)
  ["きります", "きらなかった", "Tidak memotong"],
  ["おくります", "おくらなかった", "Tidak mengirim"],
  ["あげます", "あげなかった", "Tidak memberi"],
  ["もらいます", "もらわなかった", "Tidak menerima"],
  ["かします", "かさなかった", "Tidak meminjamkan"],
  ["かります", "かりなかった", "Tidak meminjam"],
  ["おしえます", "おしえなかった", "Tidak mengajar / tidak memberitahu"],
  ["ならいます", "ならわなかった", "Tidak belajar (dari seseorang)"],
  ["かけます", "かけなかった", "Tidak menelepon"],

  // 第9課 & 第10課 (Bab 9 & 10)
  ["わかります", "わからなかった", "Tidak mengerti / tidak paham"],
  ["あります", "なかった", "Tidak ada (benda mati)"],
  ["います", "いなかった", "Tidak ada (benda hidup)"],

  // 第11課 (Bab 11)
  ["かかります", "かからなかった", "Tidak memakan (waktu/biaya)"],
  ["やすみます", "やすまなかった", "Tidak istirahat / tidak libur"],

  // 第13課 (Bab 13)
  ["あそびます", "あそばなかった", "Tidak bermain"],
  ["およぎます", "およがなかった", "Tidak berenang"],
  ["むかえます", "むかえなかった", "Tidak menjemput"],
  ["つかれます", "つかれなかった", "Tidak lelah"],
  ["けっこんします", "けっこんしなかった", "Tidak menikah"],
  ["かいものします", "かいものしなかった", "Tidak berbelanja"],
  ["しょくじします", "しょくじしなかった", "Tidak makan bersama"],
  ["さんぽします", "さんぽしなかった", "Tidak jalan-jalan"],

  // 第14課 (Bab 14)
  ["つけます", "つけなかった", "Tidak menyalakan"],
  ["けします", "けさなかった", "Tidak mematikan"],
  ["あけます", "あけなかった", "Tidak membuka"],
  ["しめます", "しめなかった", "Tidak menutup"],
  ["いそぎます", "いそがなかった", "Tidak bergegas / tidak terburu-buru"],
  ["まちます", "またなかった", "Tidak menunggu"],
  ["もちます", "もたなかった", "Tidak membawa / tidak memegang"],
  ["てつだいます", "てつだわなかった", "Tidak membantu"],
  ["よびます", "よばなかった", "Tidak memanggil"],
  ["はなします", "はなさなかった", "Tidak berbicara"],
  ["つかいます", "つかわなかった", "Tidak menggunakan"],
  ["とめます", "とめなかった", "Tidak menghentikan / tidak memarkir"],
  ["みせます", "みせなかった", "Tidak memperlihatkan"],
  ["おしえます", "おしえなかった", "Tidak memberitahu"],
  ["すわります", "すわらなかった", "Tidak duduk"],
  ["たちます", "たたなかった", "Tidak berdiri"],
  ["はいります", "はいらなかった", "Tidak masuk"],
  ["でます", "でなかった", "Tidak keluar"],
  ["ふります", "ふらなかった", "Tidak turun (hujan/salju)"],
  ["コピーします", "コピーしなかった", "Tidak mengopi / fotokopi"],

  // 第15課 (Bab 15)
  ["おきます", "おかなかった", "Tidak meletakkan"],
  ["つくります", "つくらなかった", "Tidak membuat"],
  ["うります", "うらなかった", "Tidak menjual"],
  ["しります", "しらなかった", "Tidak mengenal / tidak tahu"],
  ["すみます", "すまなかった", "Tidak tinggal / tidak bermukim"],
  ["けんきゅうします", "けんきゅうしなかった", "Tidak meneliti"],

  // 第16課 (Bab 16)
  ["のります", "のらなかった", "Tidak naik (kendaraan)"],
  ["おります", "おりなかった", "Tidak turun (kendaraan)"],
  ["のりかえます", "のりかえなかった", "Tidak transit / ganti kendaraan"],
  ["あびます", "あびなかった", "Tidak mandi (shower)"],
  ["いれます", "いれなかった", "Tidak memasukkan"],
  ["だします", "ださなかった", "Tidak mengeluarkan / tidak menyerahkan"],
  ["おろします", "おろさなかった", "Tidak mengarah / tidak mengambil uang"],
  ["おします", "おさなかった", "Tidak menekan / tidak mendorong"],

  // 第17課 (Bab 17)
  ["おぼえます", "おぼえなかった", "Tidak mengingat / tidak menghafal"],
  ["わすれます", "わすれなかった", "Tidak lupa"],
  ["なくします", "なくさなかった", "Tidak hilang"],
  ["はらいます", "はらわなかった", "Tidak membayar"],
  ["かえします", "かえさなかった", "Tidak mengembalikan"],
  ["でかけます", "でかけなかった", "Tidak bepergian / tidak keluar"],
  ["ぬぎます", "ぬがなかった", "Tidak melepas (pakaian/sepatu)"],
  ["もっていきます", "もっていかなかった", "Tidak membawa pergi"],
  ["もってきます", "もってこなかった", "Tidak membawa datang"],
  ["しんぱいします", "しんぱいしなかった", "Tidak khawatir"],
  ["ざんぎょうします", "ざんぎょうしなかった", "Tidak lembur"],
  ["しゅっちょうします", "しゅっちょうしなかった", "Tidak dinas luar kota"],
  ["のみます", "のまなかった", "Tidak minum"],

  // 第18課 (Bab 18)
  ["できます", "できなかった", "Tidak bisa / tidak sanggup"],
  ["あらいます", "あらわなかった", "Tidak mencuci"],
  ["ひきます", "ひかなかった", "Tidak bermain (alat musik petik/tuts)"],
  ["うたいます", "うたわなかった", "Tidak bernyanyi"],
  ["あつめます", "あつめなかった", "Tidak mengumpulkan"],
  ["すてます", "すてなかった", "Tidak membuang"],
  ["かえます", "かえなかった", "Tidak mengubah / tidak mengganti"],
  ["うんてんします", "うんてんしなかった", "Tidak mengemudi"],
  ["よやくします", "よやくしなかった", "Tidak merapikan / tidak memesan"],

  // 第19課 (Bab 19)
  ["のぼります", "のぼらなかった", "Tidak mendaki / tidak memanjat"],
  ["とまります", "とまらなかった", "Tidak menginap"],
  ["そうじします", "そうじしなかった", "Tidak membersihkan"],
  ["せんたくします", "せんたくしなかった", "Tidak mencuci pakaian"],
  ["れんしゅうします", "れんしゅうしなかった", "Tidak latihan"],
  ["なります", "ならなかった", "Tidak menjadi"],

  // 第20課 & 第21課 (Bab 20 & 21)
  ["いります", "いらなかった", "Tidak membutuhkan"],
  ["しらべます", "しらべなかった", "Tidak memeriksa / tidak menyelidiki"],
  ["しゅうりします", "しゅうりしなかった", "Tidak memperbaiki"],
  ["おもいます", "おもわなかった", "Tidak kira / tidak berpikir"],
  ["いいます", "いわなかった", "Tidak berkata / tidak mengucapkan"],
  ["かちます", "かたなかった", "Tidak menang"],
  ["まけます", "まけなかった", "Tidak kalah"],
  ["やくにたちます", "やくにたたなかった", "Tidak berguna"],
  ["うごきます", "うごかなかった", "Tidak bergerak"],
  ["やめます", "やめなかった", "Tidak berhenti / tidak resign"],
  ["きをつけます", "きをつけなかった", "Tidak berhati-hati"],
  ["りゅうがくします", "りゅうがくしなかった", "Tidak studi di luar negeri"],

  // 第22課 (Bab 22)
  ["きます", "きなかった", "Tidak memakai (baju)"],
  ["はきます", "はかなかった", "Tidak memakai (sepatu/celana)"],
  ["かぶりま", "かぶらなかった", "Tidak memakai (topi)"],
  ["うまれます", "うまれなかった", "Tidak lahir"],

  // 第23課 (Bab 23)
  ["まわします", "まわさなかった", "Tidak memutar"],
  ["ひきます", "ひかなかった", "Tidak menarik"],
  ["さわりま", "さわらなかった", "Tidak menyentuh"],
  ["あるきます", "あるかなかった", "Tidak berjalan kaki"],
  ["わたります", "わたらなかった", "Tidak menyeberang"],
  ["まがります", "まがらなかった", "Tidak belok"],

  // 第24課 (Bab 24)
  ["くれません", "くれなかった", "Tidak memberi (ke saya)"],
  ["なおします", "なおさなかった", "Tidak memperbaiki / tidak membetulkan"],
  ["つれていきます", "つれていかなかった", "Tidak mengajak pergi"],
  ["つれてきます", "つれてこなかった", "Tidak mengajak datang"],
  ["しょうかいします", "しょうかいしなかった", "Tidak memperkenalkan"],
  ["あんないします", "あんないしなかった", "Tidak mengarahkan / tidak memandu"],
  ["せつめいします", "せつめいしなかった", "Tidak menjelaskan"],

  // 第25課 (Bab 25)
  ["かんがえます", "かんがえなかった", "Tidak berpikir / tidak memikirkan"],
  ["つきます", "つかなかった", "Tidak tiba / tidak sampai"],
  ["たります", "たりなかった", "Tidak cukup"],
  ["とうちゃくします", "とうちゃくしなかった", "Tidak tiba"]
];

let q=[],cur=0,xp=0,streak=0;
let wrongList=[];
let perfectCorrect=0;
let selected=[];

function shuffle(a){
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
}

function updateUI(){
score.textContent=xp+" XP";
streak.textContent="x "+streak;
progressBar.style.width=(perfectCorrect/q.length*100)+"%";
qNumber.textContent=(cur+1)+" / "+q.length;
}

function loadQuestion(){

if(cur>=q.length){finish();return;}

selected=[];

const [romaji,hira,arti]=q[cur];

document.getElementById("question").textContent=romaji;
document.getElementById("meaning").textContent=arti ? `(${arti})` : "";

result.innerHTML=`
<div class="answer-wrap">
<div class="answer-box" id="answerBox"></div>
<button id="deleteBtn" onclick="deleteLetter()">⌫</button>
</div>
`;

badge.textContent="";

let letters=hira.split("");

while(letters.length<10){
letters.push("あいうえおかきくけこさしすせそたちつてと"[Math.floor(Math.random()*20)]);
}

shuffle(letters);

options.innerHTML="";

letters.forEach(l=>{
const b=document.createElement("button");
b.textContent=l;
b.onclick=()=>pickLetter(b,l,hira,romaji);
options.appendChild(b);
});

updateUI();
}

function pickLetter(btn,l,ans,romaji){
selected.push(l);
btn.disabled=true;
btn.style.opacity=".4";
answerBox.textContent=selected.join("");

if(selected.join("")===ans) correct();
else if(selected.length>=ans.length) wrong(ans,romaji);
}

function deleteLetter(){
if(selected.length===0)return;

selected.pop();
answerBox.textContent=selected.join("");

const buttons=[...options.querySelectorAll("button")];
for(let i=buttons.length-1;i>=0;i--){
if(buttons[i].disabled){
buttons[i].disabled=false;
buttons[i].style.opacity="1";
break;
}
}
}

function correct(){
streak++;
let bonus=streak>=5?5:2;
xp+=bonus;

if(streak===5) badge.textContent="🏆 COMBO x5";

result.innerHTML=`<b style="color:green;">BENAR +${bonus}XP</b>`;
perfectCorrect++;
cur++;
setTimeout(loadQuestion,1000);
}

function wrong(ans,romaji){
streak=0;

wrongList.push({
q:romaji,
your:selected.join(""),
correct:ans
});

result.innerHTML=`<b style="color:red;">SALAH → ${ans}</b>`;
cur++;
setTimeout(loadQuestion,3000);
}

function finish(){
options.innerHTML="";
result.textContent="";
badge.textContent="";

document.querySelector(".card").innerHTML=`
<div class="result-box">
<h2 style="text-align:center;">Quiz Selesai 🎉</h2>
</div>`;

progressBar.style.width="100%";
restartBtn.style.display="block";
}

function start(){
q=[...vocab];
shuffle(q);
cur=0;
xp=0;
streak=0;
perfectCorrect=0;
wrongList=[];
restartBtn.style.display="none";
loadQuestion();
}

start();

</script>
</body>
</html>
