<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Persiapan Wawancara Jepang</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
background:#e6f9e6;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

.app{
width:100%;
max-width:420px;
height:100%;
background:#ffffff;
display:flex;
flex-direction:column;
padding:14px;
position:relative;
}

/* TOP BAR */
.top-bar{
display:flex;
align-items:center;
gap:10px;
}

.level{
background:#58cc02;
color:white;
padding:6px 12px;
border-radius:14px;
font-weight:800;
}

.xp-bar{
flex:1;
height:12px;
background:#dff5d8;
border-radius:20px;
overflow:hidden;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(90deg,#58cc02,#89e219);
transition:.4s;
}

.score,.streak{
padding:6px 10px;
border-radius:14px;
background:#f1fdf0;
border:2px solid #58cc02;
font-weight:700;
}

/* INFO TABLE */
.info-table{
width:100%;
margin-top:6px;
border-collapse:collapse;
background:#f1fdf0;
border:2px solid #58cc02;
border-radius:12px;
overflow:hidden;
font-weight:800;
font-size:0.9rem;
}

.info-table td{
padding:6px 10px;
}

.quiz-name{
color:#58cc02;
text-align:left;
}

.q-number{
text-align:right;
color:#333;
}

/* CARD */
.card{
flex:1;
background:#f8fff6;
border-radius:26px;
margin:16px 0 8px 0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
overflow-y:auto;
min-height:180px;
padding:15px;
position:relative;
}

#question{
font-size:1.8rem;
font-weight:800;
color:#1a1a1a;
text-align:center;
line-height:1.4;
word-break:break-word;
}

/* BUTTON CONTOH JAWABAN */
.ans-btn{
margin-bottom:12px;
padding:10px 16px;
border:2px solid #ff9600;
background:#fff8ee;
color:#e68200;
border-radius:20px;
font-weight:800;
font-size:0.85rem;
cursor:pointer;
transition:.2s;
display:inline-flex;
align-items:center;
justify-content:center;
gap:6px;
}

.ans-btn:hover{
background:#ff9600;
color:white;
transform:scale(1.02);
}

/* MODAL POPUP */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:100;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:#ffffff;
border-radius:20px;
padding:20px;
max-width:380px;
width:100%;
max-height:85vh;
overflow-y:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
animation:fadeIn 0.2s ease-out;
}

@keyframes fadeIn{
from{transform:scale(0.9);opacity:0}
to{transform:scale(1);opacity:1}
}

.modal-header{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:2px solid #f0f0f0;
padding-bottom:10px;
margin-bottom:12px;
}

.modal-header h3{
color:#333;
font-size:1.1rem;
font-weight:800;
}

.close-btn{
background:none;
border:none;
font-size:1.5rem;
font-weight:bold;
color:#999;
cursor:pointer;
}

.modal-body{
font-size:0.9rem;
line-height:1.5;
color:#2c3e50;
}

.detail-section{
margin-bottom:12px;
padding:10px;
background:#f9f9f9;
border-left:4px solid #ff9600;
border-radius:6px;
}

.detail-title{
font-size:0.8rem;
font-weight:800;
color:#888;
text-transform:uppercase;
margin-bottom:4px;
}

.detail-content{
font-weight:600;
color:#2c3e50;
white-space:pre-line;
}

.vocab-tag{
display:inline-block;
background:#e8f5e9;
color:#2e7d32;
padding:3px 8px;
border-radius:12px;
font-size:0.8rem;
font-weight:700;
margin:2px 2px;
}

/* RESULT AREA */
.result-box{
width:100%;
height:100%;
overflow-y:auto;
padding:10px;
}

.result-header{
text-align:center;
margin-bottom:16px;
}

.result-header h2{
font-size:1.6rem;
font-weight:900;
color:#58cc02;
margin-bottom:6px;
}

.result-header p{
font-size:.9rem;
color:#666;
}

.review-table{
width:100%;
border-collapse:collapse;
font-size:.85rem;
border-radius:10px;
overflow:hidden;
}

.review-table th{
background:#58cc02;
color:white;
padding:8px;
text-align:left;
}

.review-table td{
padding:8px;
border-bottom:1px solid #eee;
}

.review-table tr:nth-child(even){
background:#f9fff7;
}

.correct{
color:#2e7d32;
font-weight:700;
}

.wrong{
color:#c62828;
font-weight:700;
}

/* OPTIONS */
#options{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

#options button{
padding:12px;
font-size:0.9rem;
border:none;
border-radius:16px;
background:#58cc02;
color:white;
font-weight:700;
cursor:pointer;
transition:.15s;
text-align:center;
}

#options button:hover{
transform:scale(1.02);
background:#46b400;
}

/* RESULT TEXT */
#result{
text-align:center;
margin-top:8px;
font-weight:800;
min-height:28px;
}

.badge{
text-align:center;
margin-top:4px;
font-weight:900;
color:#ff9600;
}

/* BUTTON */
.restart{
padding:14px;
border:none;
border-radius:16px;
font-weight:800;
font-size:1rem;
cursor:pointer;
background:#ff9600;
color:white;
margin-top:10px;
width:100%;
}

</style>
</head>

<body>

<div class="app">

<div class="top-bar">
<div class="level">XP</div>
<div class="xp-bar"><div id="progressBar"></div></div>
<div class="score" id="score">0 XP</div>
<div class="streak" id="streak">x 0</div>
</div>

<table class="info-table">
<tr>
<td class="quiz-name">Pertanyaan Wawancara</td>

</tr>
</table>

<div class="card">
<div id="question">?</div>
</div>

<!-- BUTTON CONTOH JAWABAN -->
<button class="ans-btn" id="ansBtn" onclick="openAnswerModal()">
Lihat Penjelasan
</button>

<div id="options"></div>

<div id="result"></div>
<div class="badge" id="badge"></div>

<button class="restart" id="restartBtn" onclick="start()" style="display:none;">

</button>

</div>

<!-- MODAL POPUP JAWABAN -->
<div class="modal" id="answerModal">

      <h3>Penjelasan Detail</h3>
      <button class="close-btn" onclick="closeAnswerModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalAnswerText">
      <!-- Detail jawaban dimuat secara dinamis -->
    </div>
  </div>
</div>

    ["りょうしん (Orang tua)", "さんせい (Setuju)"],
    "はい、さんせいして くれます (Hai, sansei shite kuremasu)"
  ],
  [
    "くるま を うんてん する こと が できますか", 
    "Apakah bisa mengendarai mobil / sepeda?", 
    "Kuruma wo unten suru koto ga dekimasu ka",
    ["うんてん (Mengemudi)"],
    "Hai, dekimasu / Iie, dekimasen."
  ],
  [
    "かいしゃ で もんだい が あったら どうしますか", 
    "Bagaimana jika di perusahaan ada masalah?", 
    "Kaisha de mondai ga attara dooshimasu ka",
    ["もんだい (Masalah)", "どうしますか (Bagaimana)"],
    "Senpai ya jooshi nado ni sodan / houkoku shimasu. (Konsultasi/lapor ke atasan)."
  ],
  [
    "ひとり ぐらし が いいですか、ほかの ひと と いっしょ に ぐらし ですか", 
    "Ingin tinggal sendiri atau bersama teman?", 
    "Hitori gurashi ga ii desu ka, hoka no hito to issho ni gurashi desu ka",
    ["ひとりぐらし (Tinggal sendiri)", "いっしょに (Bersama-sama)"],
    "Hitori de gurashitai desu / Tomodachi to issho ni gurashitai desu."
  ],
  [
    "まいにち なんじ に ねますか、なんじに おきますか", 
    "Kamu setiap hari tidur dan bangun jam berapa?", 
    "Mainichi nanji ni nemasu ka, nanji ni okimasu ka",
    ["ねます (Tidur)", "おきます (Bangun)"],
    "11-ji ni nemasu, 5-ji ni okimasu."
  ],
  [
    "しごと を する とき は たいせつな こと は なんと おもいますか", 
    "Menurut kamu hal apa yang paling penting saat bekerja?", 
    "Shigoto wo suru toki wa taisetsu na koto wa nan to omoimasu ka",
    ["たいせつ (Penting)", "おもいます (Menurut saya/Pikir)"],
    "Anzen ya kaisha no ruuru wo mamoru koto ga daiji to omoimasu."
  ],
  [
    "すきな ことば が ありますか", 
    "Apakah ada kosakata/ungkapan yang disukai?", 
    "Suki na kotoba ga arimasu ka",
    ["ことば (Kata/Ungkapan)"],
    "Hai, arimasu. 「あきらめないで」(Akiramenai de - Jangan menyerah)."
  ],
  [
    "しつもん が ありますか", 
    "Apakah ada pertanyaan? (Kepada pihak Perusahaan)", 
    "Shitsumon ga arimasu ka",

    "Kono kaisha de ichiban isogashii toki wa itsu desu ka? (Kapan waktu paling sibuk di perusahaan ini?)"
  ]
];

let q=[],cur=0,xp=0,streak=0;
let correct=0;
let wrong=0;
let wrongList=[];
let firstWrong=null;
let perfectCorrect=0;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

function updateUI(){
  document.getElementById("score").textContent=xp+" XP";
  document.getElementById("streak").textContent="x "+streak;

  const progress=(perfectCorrect/q.length)*100;
  document.getElementById("progressBar").style.width=progress+"%";

  document.getElementById("qNumber").textContent=(cur+1)+" / "+q.length;
}

function loadQuestion(){

  if(cur>=q.length){
    finish();
    return;
  }

  firstWrong=null;

  const [jp,indo]=q[cur];

  const qElem = document.getElementById("question");
  qElem.textContent=jp;

  if(jp.length > 25) {
    qElem.style.fontSize = "1.3rem";
  } else {
    qElem.style.fontSize = "1.8rem";
  }

  document.getElementById("result").textContent="";
  document.getElementById("badge").textContent="";

  const ops=new Set([indo]);

  while(ops.size<4){
    ops.add(vocab[Math.floor(Math.random()*vocab.length)][1]);
  }

  document.getElementById("options").innerHTML="";

  [...ops].sort(()=>Math.random()-0.5).forEach(o=>{
    const b=document.createElement("button");
    b.textContent=o;
    b.onclick=()=>check(o,indo,jp);
    document.getElementById("options").appendChild(b);
  });

  updateUI();
}

function check(sel,ans,jp){

  if(sel===ans){

    streak++;
    correct++;

    let bonus=streak>=5?5:2;
    xp+=bonus;

    if(streak==5){
      document.getElementById("badge").textContent="🏆 COMBO x5";
    }

    document.getElementById("result").textContent="BENAR +"+bonus+"XP";

    if(!firstWrong){
      perfectCorrect++;
    }

    if(firstWrong){
      wrongList.push({
        q:jp,
        your:firstWrong,
        correct:ans
      });
    }

    cur++;

    updateUI();

    setTimeout(loadQuestion,500);

  }else{

    streak=0;

    if(!firstWrong){
      firstWrong=sel;
      wrong++;
    }

    document.getElementById("result").textContent="SALAH";

  }

}

function openAnswerModal(){
  const currentItem = q[cur];
  const [jp, indo, romaji, keywords, exampleAns] = currentItem;

  let keywordsHTML = "";
  if(keywords && keywords.length > 0){
    keywordsHTML = keywords.map(k => `<span class="vocab-tag">${k}</span>`).join(" ");
  } else {
    keywordsHTML = "-";
  }

  const modalBody = `
    <div class="detail-section">
      <div class="detail-title">Pertanyaan (Jepang & Romaji)</div>
      <div class="detail-content"><b>${jp}</b>\n<i>(${romaji})</i></div>
    </div>

    <div class="detail-section">
      <div class="detail-title">Arti Bahasa Indonesia</div>
      <div class="detail-content">${indo}</div>
    </div>

    <div class="detail-section">
      <div class="detail-title">Kosakata Kunci</div>
      <div>${keywordsHTML}</div>
    </div>

    <div class="detail-section">
      <div class="detail-title">Contoh Jawaban Wawancara</div>
      <div class="detail-content">${exampleAns}</div>
    </div>
  `;

  document.getElementById("modalAnswerText").innerHTML = modalBody;
  document.getElementById("answerModal").style.display = "flex";
}

function closeAnswerModal(){
  document.getElementById("answerModal").style.display = "none";
}

function finish(){

  document.getElementById("options").innerHTML="";
  document.getElementById("result").textContent="";
  document.getElementById("badge").textContent="";
  document.getElementById("ansBtn").style.display="none";

  let html=`
  <div class="result-box">

  <div class="result-header">
  <h2>Quiz Selesai 🎉</h2>
  <p>Lihat hasil latihan wawancaramu</p>
  </div>
  `;

  if(wrongList.length>0){

    html+=`
    <table class="review-table">
    <tr>
    <th>Soal</th>
    <th>Jawaban Kamu</th>
    <th>Jawaban Benar</th>
    </tr>
    `;

    wrongList.forEach(i=>{
      html+=`
      <tr>
      <td>${i.q}</td>
      <td class="wrong">${i.your}</td>
      <td class="correct">${i.correct}</td>
      </tr>
      `;
    });

    html+=`</table>`;

  }else{

    html+=`<p style="text-align:center;font-weight:700;color:#2e7d32;">Luar biasa! Semua pertanyaan dijawab dengan benar! 🔥</p>`;

  }

  html+=`</div>`;

  document.querySelector(".card").innerHTML=html;

  document.getElementById("progressBar").style.width="100%";

  document.getElementById("restartBtn").style.display="block";

}

function start(){

  q=[...vocab];
  shuffle(q);

  cur=0;
  xp=0;
  streak=0;

  correct=0;
  wrong=0;
  perfectCorrect=0;

  wrongList=[];

  document.querySelector(".card").innerHTML='<div id="question">?</div>';
  document.getElementById("ansBtn").style.display="inline-flex";

  document.getElementById("restartBtn").style.display="none";

  loadQuestion();

}

start();

</script>
