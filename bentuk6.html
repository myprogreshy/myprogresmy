<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Vocab Game ULTRA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
background:#e6f9e6;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

.app{
width:100%;
max-width:420px;
height:100%;
background:#fff;
display:flex;
flex-direction:column;
padding:14px;
}

.top-bar{
display:flex;
align-items:center;
gap:10px;
}

.level{
background:#58cc02;
color:white;
padding:6px 12px;
border-radius:14px;
font-weight:800;
}

.xp-bar{
flex:1;
height:12px;
background:#dff5d8;
border-radius:20px;
overflow:hidden;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(90deg,#58cc02,#89e219);
transition:.4s;
}

.score,.streak{
padding:6px 10px;
border-radius:14px;
background:#f1fdf0;
border:2px solid #58cc02;
font-weight:700;
}

.info-table{
width:100%;
margin-top:6px;
border-collapse:collapse;
background:#f1fdf0;
border:2px solid #58cc02;
border-radius:12px;
overflow:hidden;
font-weight:800;
font-size:.9rem;
}

.info-table td{
padding:6px 10px;
}

.quiz-name{color:#58cc02;}
.q-number{text-align:right;}

.card{
flex:1;
background:#f8fff6;
border-radius:26px;
margin:20px 0;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
overflow:hidden;
padding:20px;
}

#question{
font-size:2.5rem;
font-weight:900;
text-align:center;
}

.meaning{
font-size:1.1rem;
font-weight:700;
color:#666;
margin-top:8px;
text-align:center;
}

.answer-wrap{
position:relative;
margin-bottom:10px;
}

.answer-box{
min-height:55px;
border:2px dashed #58cc02;
border-radius:14px;
padding:10px;
padding-right:50px;
font-size:1.4rem;
font-weight:800;
text-align:center;
}

#deleteBtn{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:none;
background:transparent;
font-size:1.5rem;
cursor:pointer;
opacity:.45;
transition:.2s;
}

#deleteBtn:hover{
opacity:1;
transform:translateY(-50%) scale(1.15);
}

#options{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
}

#options button{
padding:14px;
font-size:1.2rem;
border:none;
border-radius:16px;
background:#58cc02;
color:white;
font-weight:800;
cursor:pointer;
transition:.15s;
}

#options button:hover{
transform:scale(1.05);
}

#result{
text-align:center;
margin-top:10px;
font-weight:800;
min-height:40px;
}

.badge{
text-align:center;
font-weight:900;
color:#ff9600;
margin-top:6px;
}

.restart{
padding:14px;
border:none;
border-radius:16px;
font-weight:800;
font-size:1rem;
cursor:pointer;
background:#ff9600;
color:white;
}

.result-box{
width:100%;
height:100%;
overflow-y:auto;
padding:20px;
}

.review-table{
width:100%;
border-collapse:collapse;
font-size:.9rem;
}

.review-table th{
background:#58cc02;
color:white;
padding:8px;
}

.review-table td{
padding:8px;
border-bottom:1px solid #eee;
}

.correct{color:#2e7d32;font-weight:700;}
.wrong{color:#c62828;font-weight:700;}
</style>
</head>
<body>

<div class="app">

<div class="top-bar">
<div class="level">XP</div>
<div class="xp-bar"><div id="progressBar"></div></div>
<div class="score" id="score">0 XP</div>
<div class="streak" id="streak">x 0</div>
</div>

<table class="info-table">
<tr>
<td class="quiz-name">Perubahan Bentuk じゃない</td>
<td class="q-number" id="qNumber">1 / 7</td>
</tr>
</table>

<div class="card">
<div>
<div id="question">?</div>
<div id="meaning" class="meaning"></div>
</div>
</div>

<div id="result"></div>
<div id="options"></div>
<div class="badge" id="badge"></div>

<button class="restart" id="restartBtn" onclick="start()" style="display:none;">
Mulai Ulang
</button>

</div>

<script>

const vocab=[
  // ===== Kata Sifat-な (20 kata) =====
  ["しずかな", "しずかじゃない", "Tidak tenang / tidak sunyi"],
  ["ひまな", "ひまじゃない", "Tidak senggang / tidak luang"],
  ["にぎやかな", "にぎやかじゃない", "Tidak ramai"],
  ["べんりな", "べんりじゃない", "Tidak praktis"],
  ["ふべんな", "ふべんじゃない", "Tidak tidak praktis (mudah)"],
  ["すきな", "すきじゃない", "Tidak suka"],
  ["きらいな", "きらいじゃない", "Tidak benci"],
  ["じょうずな", "じょうずじゃない", "Tidak mahir / tidak pintar"],
  ["へたな", "へたじゃない", "Tidak bodoh / tidak payah"],
  ["たいせつな", "たいせつじゃない", "Tidak penting / tidak berharga"],
  ["たいへんな", "たいへんじゃない", "Tidak berat / tidak berat"],
  ["らくな", "らくじゃない", "Tidak mudah / tidak nyaman"],
  ["しんせつな", "しんせつじゃない", "Tidak ramah / tidak baik hati"],
  ["まじめな", "まじめじゃない", "Tidak rajin / tidak serius"],
  ["ふまじめな", "ふまじめじゃない", "Tidak tidak serius"],
  ["あんぜんな", "あんぜんじゃない", "Tidak aman"],
  ["きけんな", "きけんじゃない", "Tidak berbahaya"],
  ["ゆうめいな", "ゆうめいじゃない", "Tidak terkenal"],
  ["とくべつな", "とくべつじゃない", "Tidak spesial / tidak khusus"],
  ["じゆうな", "じゆうじゃない", "Tidak bebas"],

  // ===== Kata Benda (100 kata) =====
  // Bangunan & Tempat
  ["くうこう", "くうこうじゃない", "Bukan bandara"],
  ["こうえん", "こうえんじゃない", "Bukan taman"],
  ["ホテル", "ホテルじゃない", "Bukan hotel"],
  ["スーパー", "スーパーじゃない", "Bukan supermarket"],
  ["コンビニ", "コンビニじゃない", "Bukan minimarket"],
  ["デパート", "デパートじゃない", "Bukan department store"],
  ["きっさてん", "きっさてんじゃない", "Bukan kedai kopi"],
  ["カフェ", "カフェじゃない", "Bukan kafe"],
  ["プール", "プールじゃない", "Bukan kolam renang"],
  ["じむ", "じむじゃない", "Bukan gym"],
  ["きんじょ", "きんじょじゃない", "Bukan tetangga / lingkungan sekitar"],
  ["まち", "まちじゃない", "Bukan kota"],
  ["むら", "むらじゃない", "Bukan desa"],

  // Alam & Cuaca
  ["やま", "やまじゃない", "Bukan gunung"],
  ["かわ", "かわじゃない", "Bukan sungai"],
  ["うみ", "うみじゃない", "Bukan laut"],
  ["そら", "そらじゃない", "Bukan langit"],
  ["あめ", "あめじゃない", "Bukan hujan"],
  ["ゆき", "ゆきじゃない", "Bukan salju"],
  ["かぜ", "かぜじゃない", "Bukan angin / bukan flu"],
  ["たいよう", "たいようじゃない", "Bukan matahari"],
  ["つき", "つきじゃない", "Bukan bulan"],
  ["ほし", "ほしじゃない", "Bukan bintang"],

  // Hewan & Tumbuhan
  ["いぬ", "いぬじゃない", "Bukan anjing"],
  ["ねこ", "ねこじゃない", "Bukan kucing"],
  ["とり", "とりじゃない", "Bukan burung"],
  ["うま", "うまじゃない", "Bukan kuda"],
  ["ぞう", "ぞうじゃない", "Bukan gajah"],
  ["ライオン", "ライオンじゃない", "Bukan singa"],
  ["き", "きじゃない", "Bukan pohon"],
  ["くさ", "くさじゃない", "Bukan rumput"],

  // Barang Elektronik & Gadget
  ["スマホ", "スマホじゃない", "Bukan smartphone"],
  ["ケータイ", "ケータイじゃない", "Bukan HP"],
  ["パソコン", "パソコンじゃない", "Bukan laptop / PC"],
  ["タブレット", "タブレットじゃない", "Bukan tablet"],
  ["イヤホン", "イヤホンじゃない", "Bukan earphone"],
  ["ヘッドホン", "ヘッドホンじゃない", "Bukan headphone"],
  ["エアコン", "エアコンじゃない", "Bukan AC"],
  ["れいぞうこ", "れいぞうこじゃない", "Bukan kulkas"],
  ["せんたくき", "せんたくきじゃない", "Bukan mesin cuci"],
  ["ドライヤー", "ドライヤーじゃない", "Bukan hair dryer"],

  // Pakaian & Aksesori
  ["ふく", "ふくじゃない", "Bukan pakaian"],
  ["ズボン", "ズボンじゃない", "Bukan celana"],
  ["スカート", "スカートじゃない", "Bukan rok"],
  ["コート", "コートじゃない", "Bukan mantel / coat"],
  ["ジャケット", "ジャケットじゃない", "Bukan jaket"],
  ["ボウシ", "ボウシじゃない", "Bukan topi"],
  ["メガネ", "メガネじゃない", "Bukan kacamata"],
  ["サイフ", "サイフじゃない", "Bukan dompet"],
  ["ゆびわ", "ゆびわじゃない", "Bukan cincin"],

  // Makanan & Minuman
  ["ラーメン", "ラーメンじゃない", "Bukan ramen"],
  ["うどん", "うどんじゃない", "Bukan udon"],
  ["そば", "そばじゃない", "Bukan soba"],
  ["カレー", "カレーじゃない", "Bukan kari"],
  ["ピザ", "ピザじゃない", "Bukan pizza"],
  ["ハンバーガー", "ハンバーガーじゃない", "Bukan hamburger"],
  ["ケーキ", "ケーキじゃない", "Bukan kue"],
  ["アイスクリーム", "アイスクリームじゃない", "Bukan es krim"],
  ["チョコレート", "チョコレートじゃない", "Bukan cokelat"],
  ["コーヒー", "コーヒーじゃない", "Bukan kopi"],
  ["コーラ", "コーラじゃない", "Bukan cola"],

  // Rumah & Perabot
  ["いえ", "いえじゃない", "Bukan rumah"],
  ["アパート", "アパートじゃない", "Bukan apartemen murah / kos"],
  ["マンション", "マンションじゃない", "Bukan apartemen"],
  ["ドア", "ドアじゃない", "Bukan pintu"],
  ["まど", "まどじゃない", "Bukan jendela"],
  ["ベッド", "ベッドじゃない", "Bukan tempat tidur"],
  ["ソファー", "ソファーじゃない", "Bukan sofa"],
  ["かがみ", "かがみじゃない", "Bukan cermin"],
  ["ゴミばこ", "ゴミばこじゃない", "Bukan tempat sampah"],

  // Profesi & Orang
  ["エンジニア", "エンジニアじゃない", "Bukan insinyur / engineer"],
  ["かしゅ", "かしゅじゃない", "Bukan penyanyi"],
  ["せんしゅ", "せんしゅじゃない", "Bukan atlet"],
  ["シェフ", "シェフじゃない", "Bukan koki"],
  ["けいさつ", "けいさつじゃない", "Bukan polisi"],
  ["おきゃくさん", "おきゃくさんじゃない", "Bukan pelanggan / tamu"],
  ["こども", "こどもじゃない", "Bukan anak-anak"],
  ["おとな", "おとなじゃない", "Bukan orang dewasa"],
  ["あかちゃん", "あかちゃんじゃない", "Bukan bayi"],

  // Waktu & Konsep
  ["きょう", "きょうじゃない", "Bukan hari ini"],
  ["あした", "あしたじゃない", "Bukan besok"],
  ["きのう", "きのうじゃない", "Bukan kemarin"],
  ["いま", "いまじゃない", "Bukan sekarang"],
  ["あさ", "あさじゃない", "Bukan pagi"],
  ["ひる", "ひるじゃない", "Bukan siang"],
  ["よる", "よるじゃない", "Bukan malam"],
  ["しゅうまつ", "しゅうまつじゃない", "Bukan akhir pekan"],
  ["やすみ", "やすみじゃない", "Bukan libur"],
  ["じかん", "じかんじゃない", "Bukan waktu"],
  ["てんき", "てんきじゃない", "Bukan cuaca"],
  ["きぶん", "きぶんじゃない", "Bukan perasaan / mood"],
  ["ゆめ", "ゆめじゃない", "Bukan mimpi"],
  ["うそ", "うそじゃない", "Bukan kebohongan"],
  ["ほんとう", "ほんとうじゃない", "Bukan kebenaran"],
  ["ひみつ", "ひみつじゃない", "Bukan rahasia"],
  ["もんだい", "もんだいじゃない", "Bukan masalah / soal"],
  ["こたえ", "こたえじゃない", "Bukan jawaban"],
  ["ニュース", "ニュースじゃない", "Bukan berita"],
  ["おと", "おとじゃない", "Bukan suara / bunyi"],
  ["におい", "においじゃない", "Bukan bau / aroma"]
];

let q=[],cur=0,xp=0,streak=0;
let wrongList=[];
let perfectCorrect=0;
let selected=[];

function shuffle(a){
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
}

function updateUI(){
score.textContent=xp+" XP";
streak.textContent="x "+streak;
progressBar.style.width=(perfectCorrect/q.length*100)+"%";
qNumber.textContent=(cur+1)+" / "+q.length;
}

function loadQuestion(){

if(cur>=q.length){finish();return;}

selected=[];

const [romaji,hira,arti]=q[cur];

document.getElementById("question").textContent=romaji;
document.getElementById("meaning").textContent=arti ? `(${arti})` : "";

result.innerHTML=`
<div class="answer-wrap">
<div class="answer-box" id="answerBox"></div>
<button id="deleteBtn" onclick="deleteLetter()">⌫</button>
</div>
`;

badge.textContent="";

let letters=hira.split("");

while(letters.length<10){
letters.push("あいうえおかきくけこさしすせそたちつてと"[Math.floor(Math.random()*20)]);
}

shuffle(letters);

options.innerHTML="";

letters.forEach(l=>{
const b=document.createElement("button");
b.textContent=l;
b.onclick=()=>pickLetter(b,l,hira,romaji);
options.appendChild(b);
});

updateUI();
}

function pickLetter(btn,l,ans,romaji){
selected.push(l);
btn.disabled=true;
btn.style.opacity=".4";
answerBox.textContent=selected.join("");

if(selected.join("")===ans) correct();
else if(selected.length>=ans.length) wrong(ans,romaji);
}

function deleteLetter(){
if(selected.length===0)return;

selected.pop();
answerBox.textContent=selected.join("");

const buttons=[...options.querySelectorAll("button")];
for(let i=buttons.length-1;i>=0;i--){
if(buttons[i].disabled){
buttons[i].disabled=false;
buttons[i].style.opacity="1";
break;
}
}
}

function correct(){
streak++;
let bonus=streak>=5?5:2;
xp+=bonus;

if(streak===5) badge.textContent="🏆 COMBO x5";

result.innerHTML=`<b style="color:green;">BENAR +${bonus}XP</b>`;
perfectCorrect++;
cur++;
setTimeout(loadQuestion,1000);
}

function wrong(ans,romaji){
streak=0;

wrongList.push({
q:romaji,
your:selected.join(""),
correct:ans
});

result.innerHTML=`<b style="color:red;">SALAH → ${ans}</b>`;
cur++;
setTimeout(loadQuestion,3000);
}

function finish(){
options.innerHTML="";
result.textContent="";
badge.textContent="";

document.querySelector(".card").innerHTML=`
<div class="result-box">
<h2 style="text-align:center;">Quiz Selesai 🎉</h2>
</div>`;

progressBar.style.width="100%";
restartBtn.style.display="block";
}

function start(){
q=[...vocab];
shuffle(q);
cur=0;
xp=0;
streak=0;
perfectCorrect=0;
wrongList=[];
restartBtn.style.display="none";
loadQuestion();
}

start();

</script>
</body>
</html>
