<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Vocab Game ULTRA - Pola Kalimat Bab 1-5</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
background:#e6f9e6;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

.app{
width:100%;
max-width:420px;
height:100%;
background:#ffffff;
display:flex;
flex-direction:column;
padding:14px;
}

/* TOP BAR */

.top-bar{
display:flex;
align-items:center;
gap:10px;
}

.level{
background:#58cc02;
color:white;
padding:6px 12px;
border-radius:14px;
font-weight:800;
}

.xp-bar{
flex:1;
height:12px;
background:#dff5d8;
border-radius:20px;
overflow:hidden;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(90deg,#58cc02,#89e219);
transition:.4s;
}

.score,.streak{
padding:6px 10px;
border-radius:14px;
background:#f1fdf0;
border:2px solid #58cc02;
font-weight:700;
}

/* INFO TABLE */

.info-table{
width:100%;
margin-top:6px;
border-collapse:collapse;
background:#f1fdf0;
border:2px solid #58cc02;
border-radius:12px;
overflow:hidden;
font-weight:800;
font-size:0.9rem;
}

.info-table td{
padding:6px 10px;
}

.quiz-name{
color:#58cc02;
text-align:left;
}

.q-number{
text-align:right;
color:#333;
}

/* CARD */

.card{
flex:1;
background:#f8fff6;
border-radius:26px;
margin:20px 0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
overflow:hidden;
padding:20px;
}

#question{
font-size:1.8rem;
font-weight:900;
color:#000;
text-align:center;
line-height:1.4;
}

.meaning{
font-size:0.95rem;
font-weight:600;
color:#666;
margin-top:8px;
text-align:center;
}

/* RESULT AREA */

.result-box{
width:100%;
height:100%;
overflow-y:auto;
padding:20px;
}

.result-header{
text-align:center;
margin-bottom:16px;
}

.result-header h2{
font-size:1.6rem;
font-weight:900;
color:#58cc02;
margin-bottom:6px;
}

.result-header p{
font-size:.9rem;
color:#666;
}

.review-table{
width:100%;
border-collapse:collapse;
font-size:.85rem;
border-radius:10px;
overflow:hidden;
}

.review-table th{
background:#58cc02;
color:white;
padding:8px;
text-align:left;
}

.review-table td{
padding:8px;
border-bottom:1px solid #eee;
}

.review-table tr:nth-child(even){
background:#f9fff7;
}

.correct{
color:#2e7d32;
font-weight:700;
}

.wrong{
color:#c62828;
font-weight:700;
}

/* OPTIONS */

#options{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

#options button{
padding:14px;
font-size:1rem;
border:none;
border-radius:16px;
background:#58cc02;
color:white;
font-weight:800;
cursor:pointer;
transition:.15s;
text-align:center;
}

#options button:hover{
transform:scale(1.02);
background:#46b400;
}

/* RESULT TEXT */

#result{
text-align:center;
margin-top:8px;
font-weight:800;
min-height:28px;
}

.badge{
text-align:center;
margin-top:4px;
font-weight:900;
color:#ff9600;
}

/* BUTTON */

.restart{
padding:14px;
border:none;
border-radius:16px;
font-weight:800;
font-size:1rem;
cursor:pointer;
background:#ff9600;
color:white;
}

</style>
</head>

<body>

<div class="app">

<div class="top-bar">
<div class="level">XP</div>
<div class="xp-bar"><div id="progressBar"></div></div>
<div class="score" id="score">0 XP</div>
<div class="streak" id="streak">x 0</div>
</div>

<table class="info-table">
<tr>
<td class="quiz-name">Pola Kalimat Bab 6-10</td>
<td class="q-number" id="qNumber">1 / 12</td>
</tr>
</table>

<div class="card">
<div id="question">?</div>
<div class="meaning" id="meaning"></div>
</div>

<div id="options"></div>

<div id="result"></div>
<div class="badge" id="badge"></div>

<button class="restart" id="restartBtn" onclick="start()" style="display:none;">
Mulai Ulang
</button>

</div>

<script>

// Format: [Kalimat Jepang, Fungsi Singkat, Arti Kalimat]
const vocab=[
  // BAB 6
  ["ジュースをのみます", "objek [o]", "Saya minum jus."],
  ["サッカーをします", "melakukan kegiatan", "Saya bermain sepak bola."],
  ["かいぎをします", "melakukan kegiatan", "Saya melakukan rapat."],
  ["しごとをします", "melakukan kegiatan", "Saya bekerja."],
  ["げつようびなにをしますか", "tanya kegiatan [apa]", "Hari Senin Anda melakukan apa?"],
  ["きのうなにをしましたか", "tanya kegiatan lampau", "Kemarin Anda melakukan apa?"],
  ["それはなんですか", "tanya benda [apa]", "Itu apa?"],
  ["なにをかいますか", "tanya objek [membeli apa]", "Anda membeli apa?"],
  ["えきでしんぶんをかいます", "lokasi aksi [de]", "Saya membeli koran di stasiun."],
  ["いっしょにきょうとへいきませんか", "tentang ajakan [-masenka]", "Mau pergi ke Kyoto bersama-sama?"],
  ["ちょっとやすみましょう", "mari/ayo [-mashou]", "Mari istirahat sebentar."],
  ["ええ、たべましょう", "menyetujui ajakan", "Ya, mari makan."],
  ["きょうとですか、いいですね", "pilihan / kesan", "Ke Kyoto ya? Bagus ya."],

  // BAB 7
  ["はしでたべます", "alat / sarana [de]", "Saya makan dengan sumpit."],
  ["にほんごでレポートをかきます", "bahasa [de]", "Saya menulis laporan dalam bahasa Jepang."],
  ["ありがとうはえいごでなんですか", "tanya padanan bahasa", "Apa bahasa Inggrisnya 'arigatou'?"],
  ["thank youはにほんごでなんですか", "tanya padanan bahasa", "Apa bahasa Jepang-nya 'thank you'?"],
  ["わたしはきむらさんにはなをあげました", "memberi [ni agemashita]", "Saya memberi bunga kepada Sdr. Kimura."],
  ["わたしはいーさんにおんをかしました", "meminjamkan [ni kashimashita]", "Saya meminjamkan buku kepada Sdr. Lee."],
  ["わたしはやまださんにえいごをおしえます", "mengajar [ni oshiemasu]", "Saya mengajar bahasa Inggris kepada Sdr. Yamada."],
  ["わたしはやまださんにはなをもらいました", "menerima [ni moraimashita]", "Saya menerima bunga dari Sdr. Yamada."],
  ["わたしはカリナさんにCDをかりました", "meminjam [ni karimashita]", "Saya meminjam CD dari Sdr. Karina."],
  ["わたしはわんさんにちゅうごくごをならいます", "belajar [ni naraimasu]", "Saya belajar bahasa Mandarin dari Sdr. Wang."],
  ["わたしはやまださんからはなをもらいました", "menerima dari [kara]", "Saya menerima bunga dari Sdr. Yamada."],
  ["ぎんこうからおかねをかりました", "meminjam dari instansi [kara]", "Saya meminjam uang dari bank."],
  ["もうにもつをおくりましたか", "tanya sudah/belum [mou]", "Apakah Anda sudah mengirim paket?"],
  ["はい、もうおくりました", "jawaban sudah [mou]", "Ya, saya sudah mengirimnya."],
  ["いいえ、まだです", "jawaban belum [mada]", "Belum."],
  ["このスプーン、すきですね", "kesukaan", "Sendok ini bagus/suka ya."],
  ["コーヒー、もういっぱいいかがですか", "penawaran [bagaimana kalau]", "Bagaimana kalau minum kopi satu cangkir lagi?"],

  // BAB 8
  ["ワットせんせいはしんせつです", "kata sifat-Na", "Sdr. Watt ramah."],
  ["ふじさんはたかいです", "kata sifat-I", "Gunung Fuji tinggi."],
  ["あそこはしずかじゃありません", "negasi kata sifat-Na", "Di sana tidak tenang/sepi."],
  ["このほんはおもしろくないです", "negasi kata sifat-I", "Buku ini tidak menarik."],
  ["ペキンはさむいですか", "tanya kata sifat-I", "Apakah Beijing dingin?"],
  ["ならこうえんはにぎやかですか", "tanya kata sifat-Na", "Apakah Taman Nara ramai?"],
  ["ワットせんせいはしんせつなせんせいです", "kata sifat-Na + benda", "Sdr. Watt adalah guru yang ramah."],
  ["ふじさんはたかいやまです", "kata sifat-I + benda", "Gunung Fuji adalah gunung yang tinggi."],
  ["にほんのたべものはおいしいですが、たかいです", "kontras [ga = tetapi]", "Makanan Jepang enak, tetapi mahal."],
  ["ペキンはとてもさむいです", "penekan [totemo = sangat]", "Beijing sangat dingin."],
  ["これはとてもゆうめいなえいがです", "penekan [totemo = sangat]", "Ini adalah film yang sangat terkenal."],
  ["シャンハイはあまりさむくないです", "penangkal [amari + negasi]", "Shanghai tidak begitu dingin."],
  ["さくらだいがくはあまりゆうめいなだいがくじゃありません", "penangkal [amari + negasi]", "Universitas Sakura bukan universitas yang begitu terkenal."],
  ["にほんのせいかつはどうですか", "tanya kesan [doudesuka]", "Bagaimana kehidupan di Jepang?"],
  ["ならはどんなまちですか", "tanya deskripsi [donna]", "Nara itu kota yang bagaimana?"],
  ["そうですね", "berpikir / merespons", "Bagaimana ya... / Iya juga ya."],

  // BAB 9
  ["わたしはイタリアりょうりがすきです", "kesukaan [ga suki]", "Saya suka masakan Italia."],
  ["わたしはにほんごがわかります", "pemahaman [ga wakarimasu]", "Saya paham bahasa Jepang."],
  ["わたしはくるまがあります", "kepemilikan [ga arimasu]", "Saya punya mobil."],
  ["どんなスポーツがすきですか", "tanya jenis kesukaan", "Olahraga seperti apa yang Anda sukai?"],
  ["えいごがよくわかります", "tingkat [yoku = sangat paham]", "Saya sangat paham bahasa Inggris."],
  ["えいごがすこしわかります", "tingkat [sukoshi = sedikit]", "Saya sedikit paham bahasa Inggris."],
  ["えいごがあまりわかりません", "tingkat [amari + negasi]", "Saya tidak begitu paham bahasa Inggris."],
  ["おかねがたくさんあります", "jumlah [takusan = banyak]", "Saya punya banyak uang."],
  ["おかねがぜんぜんありません", "jumlah [zenzen + negasi]", "Saya sama sekali tidak punya uang."],
  ["ここはすこしさむいです", "tingkat [sukoshi = sedikit]", "Di sini sedikit dingin."],
  ["あのえいがはぜんぜんおもしろくないです", "tingkat [zenzen + negasi]", "Film itu sama sekali tidak menarik."],
  ["じかんがありませんから、しんぶんをよみません", "alasan [kara = karena]", "Karena tidak ada waktu, saya tidak membaca koran."],
  ["いいえ、よみません、じかんがありませんから", "alasan di akhir kalimat", "Tidak, saya tidak membaca, karena tidak ada waktu."],
  ["どうしてあさしんぶんをよみませんか", "tanya alasan [doushite]", "Mengapa pagi hari tidak membaca koran?"],
  ["どうしてですか", "tanya alasan [kenapa]", "Mengapa?"],

  // BAB 10
  ["コンピューターがあります", "keberadaan benda mati [arimasu]", "Ada komputer."],
  ["さくらがあります", "keberadaan benda mati", "Ada bunga sakura."],
  ["こうえんがあります", "keberadaan tempat/benda", "Ada taman."],
  ["おとこのひとがいます", "keberadaan benda hidup [imasu]", "Ada laki-laki."],
  ["いぬがいます", "keberadaan hewan [imasu]", "Ada anjing."],
  ["わたしのへやにつくえがあります", "lokasi keberadaan [ni]", "Di kamar saya ada meja."],
  ["じむしょにミラーさんがいます", "lokasi keberadaan orang", "Di kantor ada Sdr. Miller."],
  ["ちかになにがありますか", "tanya benda di lokasi", "Ada apa di bawah tanah?"],
  ["レストランがあります", "keberadaan benda mati", "Ada restoran."],
  ["うけつけにだれがいますか", "tanya orang di lokasi", "Ada siapa di resepsionis?"],
  ["きむらさんがいます", "keberadaan orang", "Ada Sdr. Kimura."],
  ["とうきょうディズニーランドはちばけんにあります", "lokasi subjek spesifik", "Tokyo Disneyland ada di Prefektur Chiba."],
  ["とうきょうディズニーランドはどこにありますか", "tanya lokasi subjek", "Tokyo Disneyland ada di mana?"],
  ["ミラーさんはどこにいますか", "tanya lokasi orang", "Sdr. Miller ada di mana?"],
  ["とうきょうディズニーランドはどこですか", "tanya lokasi singkat", "Tokyo Disneyland di mana?"],
  ["つくえのうえにしゃしんがあります", "posisi relatif [ue = atas]", "Di atas meja ada foto."],
  ["ゆうびんきょくはぎんこうのとなりにあります", "posisi relatif [tonari = samping]", "Kantor pos ada di samping bank."],
  ["ほんやははなやとスーパーのあいだにあります", "posisi relatif [aida = antara]", "Toko buku ada di antara toko bunga dan supermarket."],
  ["えきのちかくでともだちにあいました", "posisi relatif [chikaku = dekat]", "Saya bertemu teman di dekat stasiun."],
  ["はこのなかにてがみやしゃしんなどがあります", "pilihan sebagian [ya... nado]", "Di dalam kotak ada surat, foto, dll."],
  ["アジアストアですか、あのびるのなかです", "posisi relatif [naka = dalam]", "Asia Store? Ada di dalam gedung itu."]
];

let q=[],cur=0,xp=0,streak=0;
let correct=0;
let wrong=0;
let wrongList=[];
let firstWrong=null;
let perfectCorrect=0;

function shuffle(a){
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
}

function updateUI(){

document.getElementById("score").textContent=xp+" XP";
document.getElementById("streak").textContent="x "+streak;

const progress=(perfectCorrect/q.length)*100;
document.getElementById("progressBar").style.width=progress+"%";

document.getElementById("qNumber").textContent=(cur+1)+" / "+q.length;

}

function loadQuestion(){

if(cur>=q.length){
finish();
return;
}

firstWrong=null;

const [jpSentence, func, meaning]=q[cur];

document.getElementById("question").textContent=jpSentence;
document.getElementById("meaning").textContent=meaning;
document.getElementById("result").textContent="";
document.getElementById("badge").textContent="";

const ops=new Set([func]);

while(ops.size<4){
ops.add(vocab[Math.floor(Math.random()*vocab.length)][1]);
}

document.getElementById("options").innerHTML="";

[...ops].sort(()=>Math.random()-0.5).forEach(o=>{
const b=document.createElement("button");
b.textContent=o;
b.onclick=()=>check(o,func,jpSentence);
document.getElementById("options").appendChild(b);
});

updateUI();
}

function check(sel,ans,jpSentence){

if(sel===ans){

streak++;
correct++;

let bonus=streak>=5?5:2;
xp+=bonus;

if(streak==5){
document.getElementById("badge").textContent="🏆 COMBO x5";
}

document.getElementById("result").textContent="BENAR +"+bonus+"XP";

if(!firstWrong){
perfectCorrect++;
}

if(firstWrong){
wrongList.push({
q:jpSentence,
your:firstWrong,
correct:ans
});
}

cur++;

updateUI();

setTimeout(loadQuestion,500);

}else{

streak=0;

if(!firstWrong){
firstWrong=sel;
wrong++;
}

document.getElementById("result").textContent="SALAH";

}

}

function finish(){

document.getElementById("options").innerHTML="";
document.getElementById("result").textContent="";
document.getElementById("badge").textContent="";

let html=`
<div class="result-box">

<div class="result-header">
<h2>Quiz Selesai 🎉</h2>
<p>Lihat progres belajarmu</p>
</div>
`;

if(wrongList.length>0){

html+=`
<table class="review-table">
<tr>
<th>Soal</th>
<th>Jawaban Kamu</th>
<th>Jawaban Benar</th>
</tr>
`;

wrongList.forEach(i=>{
html+=`
<tr>
<td>${i.q}</td>
<td class="wrong">${i.your}</td>
<td class="correct">${i.correct}</td>
</tr>
`;
});

html+=`</table>`;

}else{

html+=`<p style="text-align:center;font-weight:700;color:#2e7d32;">Semua jawaban benar! 🔥</p>`;

}

html+=`</div>`;

document.querySelector(".card").innerHTML=html;

document.getElementById("progressBar").style.width="100%";

document.getElementById("restartBtn").style.display="block";

}

function start(){

q=[...vocab];
shuffle(q);

cur=0;
xp=0;
streak=0;

correct=0;
wrong=0;
perfectCorrect=0;

wrongList=[];

document.querySelector(".card").innerHTML='<div id="question">?</div><div class="meaning" id="meaning"></div>';

document.getElementById("restartBtn").style.display="none";

loadQuestion();

}

start();

</script>

</body>
</html>
