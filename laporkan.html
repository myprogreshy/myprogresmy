<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporkan Bug - Quiz Bahasa Jepang</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
  emailjs.init("5A_j5oQ7f8c2NtuP7");
})();
</script>

<style>
:root {
  --bg: #0f172a;
  --card-bg: rgba(30, 41, 59, 0.7);
  --border: rgba(255, 255, 255, 0.1);
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --accent: #38bdf8;
  --accent-hover: #0284c7;
  --input-bg: rgba(15, 23, 42, 0.6);
  --success: #10b981;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background: rgba(30, 41, 59, 0.5);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 20px 25px;
}

header h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
}

header p {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* MAIN */
main {
  flex: 1;
  padding: 30px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CARD */
.card {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
}

.card h2 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.card p {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
  line-height: 1.5;
}

/* FORM */
.form-group {
  margin-bottom: 16px;
}

label {
  font-size: 13px;
  font-weight: 500;
  display: block;
  margin-bottom: 6px;
  color: var(--text-secondary);
}

input, textarea {
  width: 100%;
  padding: 12px 14px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  color: var(--text-primary);
  transition: all 0.2s ease;
}

input::placeholder, textarea::placeholder {
  color: #64748b;
}

input:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
}

textarea {
  min-height: 120px;
  resize: vertical;
}

/* BUTTON */
.btn {
  margin-top: 8px;
  background: var(--accent);
  color: #0f172a;
  font-weight: 600;
  border: none;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  width: 100%;
  font-size: 14px;
  transition: all 0.2s ease;
}

.btn:hover {
  background: var(--accent-hover);
  color: #ffffff;
}

/* BACK BUTTON */
.back {
  margin-top: 10px;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  width: 100%;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s ease;
}

.back:hover {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
}

/* STATUS MESSAGES */
.loading {
  display: none;
  margin-top: 12px;
  font-size: 13px;
  color: var(--accent);
  text-align: center;
}

.success {
  display: none;
  margin-top: 12px;
  font-size: 13px;
  color: var(--success);
  text-align: center;
  padding: 10px;
  background: rgba(16, 185, 129, 0.1);
  border-radius: 8px;
  border: 1px solid rgba(16, 185, 129, 0.2);
}

/* FOOTER */
footer {
  border-top: 1px solid var(--border);
  padding: 16px;
  text-align: center;
  font-size: 12px;
  color: var(--text-secondary);
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Quiz Bahasa Jepang</h1>
  <p>Laporkan Bug</p>
</header>

<main>

<div class="card">

<h2>🐛 Laporkan Bug</h2>
<p>Temukan kesalahan atau bug? Laporkan kepada kami agar segera diperbaiki.</p>

<div class="form-group">
  <label for="nama">Nama (opsional)</label>
  <input type="text" id="nama" placeholder="Nama kamu">
</div>

<div class="form-group">
  <label for="pesan">Deskripsi Bug</label>
  <textarea id="pesan" placeholder="Jelaskan bug yang kamu temukan..."></textarea>
</div>

<button class="btn" onclick="kirim()">Kirim Laporan</button>

<div class="loading" id="loading">⏳ Mengirim laporan...</div>
<div class="success" id="success">✅ Laporan berhasil dikirim! Terima kasih.</div>

<button class="back" onclick="history.back()">Kembali</button>

</div>

</main>

<footer>© 2026 Quiz Jepang</footer>

</div>

<script>
function kirim(){
  const nama = document.getElementById("nama").value;
  const pesan = document.getElementById("pesan").value;

  if(pesan.trim() === ""){
    alert("Deskripsi bug tidak boleh kosong!");
    return;
  }

  document.getElementById("loading").style.display = "block";
  document.getElementById("success").style.display = "none";

  emailjs.send("service_sskzgxn","template_y4o0v0a",{
    nama: nama || "Anonim",
    pesan: "[BUG] " + pesan,
    to_email: "EMAILKAMU@gmail.com"
  })
  .then(function(){
    document.getElementById("loading").style.display = "none";
    document.getElementById("success").style.display = "block";

    document.getElementById("nama").value = "";
    document.getElementById("pesan").value = "";
  })
  .catch(function(error){
    document.getElementById("loading").style.display = "none";
    alert("❌ Gagal mengirim!");
    console.log(error);
  });
}
</script>

</body>
</html>
