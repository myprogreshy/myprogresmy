<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Quiz Jepang</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#2c7be5;
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --success:#2ec4b6; /* Warna hijau untuk tanda kuis selesai */
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:900px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:20px 25px;
}

header h1{
  font-size:20px;
  font-weight:600;
}

header p{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}

/* MAIN */
main{
  flex:1;
  padding:25px;
}

h2{
  font-size:18px;
  font-weight:600;
  margin-bottom:15px;
}

/* GRID MENU */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:15px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:16px 18px;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  border-color:var(--primary);
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.card h3{
  font-size:15px;
  font-weight:600;
}

.card span{
  font-size:12px;
  color:var(--muted);
}

/* LIST */
.list{
  display:grid;
  gap:10px;
}

.item{
  background:#fff;
  border:1px solid #e5e7eb;
  padding:14px 16px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:.15s;
}

.item:hover{
  border-color:var(--primary);
  background:#f0f6ff;
}

/* Gaya khusus untuk item kuis yang selesai dikerjakan */
.item.completed {
  border-color: var(--success);
  background: #f0fdfa;
}

.item.completed .status-icon {
  color: var(--success);
  font-weight: bold;
}

.back{
  margin-top:15px;
  background:#f3f4f6;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:12px;
  cursor:pointer;
}

/* FOOTER */
footer{
  border-top:1px solid #e5e7eb;
  padding:12px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}

/* HIDDEN */
.hidden{display:none}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Quiz Bahasa Jepang</h1>
  <p>Menu Kosakata</p>
</header>

<main>

<!-- MENU -->
<section id="menu">
  <h2>Kategori</h2>
  <div class="grid">
    <div class="card" onclick="openGanbaro()">
      <h3>Ganbaro Gakkou</h3>
      <span>Ganbaro Gakkou Ponorogo</span>
    </div>
    <div class="card" onclick="openPemula()">
      <h3>Kosakata Pemula</h3>
      <span>Kosakata Untuk Pemula</span>
    </div>
    <div class="card" onclick="openKata()">
      <h3>Kata Kerja & Sifat</h3>
      <span>Kata Kerja Dan Kata Sifat</span>
    </div>
    <div class="card" onclick="openRandom()">
      <h3>Kosakata Random</h3>
      <span>Kosakata Acak</span>
    </div>
    <div class="card" onclick="openBuild()">
      <h3>Buat Kosakata</h3>
      <span>Buat Kosakata Anda</span>
    </div>
  </div>
</section>

<!-- SUBMENU -->
<section id="submenu" class="hidden"></section>

</main>

<footer>© 2026 Quiz Jepang</footer>

</div>

<script>
const quizLinks={
    ganbaro:{
    "Kata Benda 1-100":"ganbaro1.html",
    "Kata Benda 100-200":"ganbaro2.html",
    "Kata Benda 200-244":"ganbaro3.html",
    "Kata Kerja 1-100":"ganbaro4.html",
    "Kata Kerja 100-136":"ganbaro5.html",
    "Kata Sifat 1-71":"ganbaro6.html",
    "LATIHAN UJIAN DASAR FULL!!":"ujian.html",
    "Minna Bab 1-5":"bab1-5.html",
    "Minna Bab 6-10":"bab6-10.html",
    "Minna Bab 11-15":"bab11-15.html",
    "Minna Bab 16-20":"bab16-20.html",
    "Minna Bab 20-25":"bab20-25.html",
    "Perubahan Bentuk て":"bentuk.html",
    "Perubahan Bentuk ない":"bentuk1.html",
    "Perubahan Bentuk る":"bentuk2.html",
    "Perubahan Bentuk た":"bentuk3.html",
    "Wawancara Mensetsu":"wawancara.html",
},
  pemula:{
    "Kata Sapaan":"pemulasapaan.html",
    "Kata Ganti":"pemulaganti.html",
    "Nama Hari":"pemulahari.html",
    "Waktu":"pemulawaktu.html",
    "Nama Bulan":"pemulabulan.html",
    "Warna":"pemulawarna.html",
    "Angka":"pemulaangka.html",
    "Anggota Tubuh":"pemulatubuh.html",
    "Peralatan Sekolah":"psekolah.html",
    "Peralatan Dapur":"pemuladapur.html",
    "Buah dan Sayur":"pemulasayur.html",
    "Ungkapan Pemula":"ganbaro.html",
  },
  kata:{
    "Kata Kerja":"katakerja.html",
    "Kata Sifat":"katasifat.html",
  },
random:{
    "Kosakata 1":"kosakata.html",
    "Kosakata 2":"kotoba.html",
    "Kosakata 3":"n5kosakata.html",
    "Kosakata 4":"xpresstka.html",
    "Kosakata 5":"kamussaku.html",
},
  build:{
    "Buat Kosakata":"developer.html",
}
};

function show(id){
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("submenu").classList.add("hidden");
  document.getElementById(id).classList.remove("hidden");
}

function openGanbaro(){ buildSub("Ganbaro Gakkou","ganbaro"); }
function openPemula(){ buildSub("Kosakata Pemula","pemula"); }
function openKata(){ buildSub("Kata Kerja & Sifat","kata"); }
function openMinna(){ buildSub("Minna no Nihongo","minna"); }
function openRandom(){ buildSub("Kosakata Random","random"); }
function openBuild(){ buildSub("Buat Kosakata","build"); }

// 1. Fungsi penentu Jendela Waktu (Reset otomatis 2x sehari pada jam 12:00 dan 00:00)
function getCurrentPeriodId() {
  const d = new Date();
  const dateStr = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  const period = d.getHours() < 12 ? "AM" : "PM"; // AM (00:00 - 11:59) & PM (12:00 - 23:59)
  return `${dateStr}-${period}`;
}

// 2. Fungsi validasi status reset kuis
function checkExpiry() {
  const currentPeriod = getCurrentPeriodId();
  const savedPeriod = localStorage.getItem("quiz_period_id");
  
  // Apabila wilayah waktu berubah (pindah hari atau berganti AM/PM), hapus riwayat lama!
  if (savedPeriod !== currentPeriod) {
    localStorage.removeItem("quiz_history");
    localStorage.setItem("quiz_period_id", currentPeriod);
    return {};
  }
  
  return JSON.parse(localStorage.getItem("quiz_history")) || {};
}

function buildSub(title,key){
  // Validasi kuis hangus dijalankan setiap kali membuka submenu kuis
  const history = checkExpiry();
  const box=document.getElementById("submenu");
  
  box.innerHTML=`
    <h2>${title}</h2>
    <div class="list">
      ${Object.keys(quizLinks[key]).map(k=> {
        const url = quizLinks[key][k];
        const isCompleted = history[url] ? true : false;
        
        return `
          <div class="item ${isCompleted ? 'completed' : ''}" onclick="go('${url}')">
            ${k}
            <span class="status-icon">${isCompleted ? '✓' : '→'}</span>
          </div>
        `;
      }).join('')}
      <button class="back" onclick="show('menu')">Kembali</button>
    </div>
  `;
  show("submenu");
}

function go(url){
  // Jalankan cek masa aktif sesaat sebelum menyimpan riwayat baru
  const history = checkExpiry();
  
  // Berikan label lulus/selesai pada kuis aktif
  history[url] = true;
  localStorage.setItem("quiz_history", JSON.stringify(history));

  // Menuju halaman kuis
  window.location.href=url;
}

// Jalankan fungsi pengontrol pertama kali aplikasi dimuat
checkExpiry();
</script>

</body>
</html>
