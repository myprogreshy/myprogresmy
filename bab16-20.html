<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Vocab Game ULTRA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
background:#e6f9e6;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

.app{
width:100%;
max-width:420px;
height:100%;
background:#ffffff;
display:flex;
flex-direction:column;
padding:14px;
}

/* TOP BAR */

.top-bar{
display:flex;
align-items:center;
gap:10px;
}

.level{
background:#58cc02;
color:white;
padding:6px 12px;
border-radius:14px;
font-weight:800;
}

.xp-bar{
flex:1;
height:12px;
background:#dff5d8;
border-radius:20px;
overflow:hidden;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(90deg,#58cc02,#89e219);
transition:.4s;
}

.score,.streak{
padding:6px 10px;
border-radius:14px;
background:#f1fdf0;
border:2px solid #58cc02;
font-weight:700;
}

/* INFO TABLE */

.info-table{
width:100%;
margin-top:6px;
border-collapse:collapse;
background:#f1fdf0;
border:2px solid #58cc02;
border-radius:12px;
overflow:hidden;
font-weight:800;
font-size:0.9rem;
}

.info-table td{
padding:6px 10px;
}

.quiz-name{
color:#58cc02;
text-align:left;
}

.q-number{
text-align:right;
color:#333;
}

/* CARD */

.card{
flex:1;
background:#f8fff6;
border-radius:26px;
margin:20px 0;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
overflow:hidden;
}

#question{
font-size:2.6rem;
font-weight:900;
color:#000;
text-align:center;
}

/* RESULT AREA */

.result-box{
width:100%;
height:100%;
overflow-y:auto;
padding:20px;
}

.result-header{
text-align:center;
margin-bottom:16px;
}

.result-header h2{
font-size:1.6rem;
font-weight:900;
color:#58cc02;
margin-bottom:6px;
}

.result-header p{
font-size:.9rem;
color:#666;
}

.review-table{
width:100%;
border-collapse:collapse;
font-size:.9rem;
border-radius:10px;
overflow:hidden;
}

.review-table th{
background:#58cc02;
color:white;
padding:8px;
text-align:left;
}

.review-table td{
padding:8px;
border-bottom:1px solid #eee;
}

.review-table tr:nth-child(even){
background:#f9fff7;
}

.correct{
color:#2e7d32;
font-weight:700;
}

.wrong{
color:#c62828;
font-weight:700;
}

/* OPTIONS */

#options{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

#options button{
padding:16px;
font-size:1.3rem;
border:none;
border-radius:18px;
background:#58cc02;
color:white;
font-weight:800;
cursor:pointer;
transition:.15s;
}

#options button:hover{
transform:scale(1.05);
background:#46b400;
}

/* RESULT TEXT */

#result{
text-align:center;
margin-top:8px;
font-weight:800;
min-height:28px;
}

.badge{
text-align:center;
margin-top:4px;
font-weight:900;
color:#ff9600;
}

/* BUTTON */

.restart{
padding:14px;
border:none;
border-radius:16px;
font-weight:800;
font-size:1rem;
cursor:pointer;
background:#ff9600;
color:white;
}

</style>
</head>

<body>

<div class="app">

<div class="top-bar">
<div class="level">XP</div>
<div class="xp-bar"><div id="progressBar"></div></div>
<div class="score" id="score">0 XP</div>
<div class="streak" id="streak">x 0</div>
</div>

<table class="info-table">
<tr>
<td class="quiz-name">Kotoba Bab 16-20</td>
<td class="q-number" id="qNumber">1 / 12</td>
</tr>
</table>

<div class="card">
<div id="question">?</div>
</div>

<div id="options"></div>

<div id="result"></div>
<div class="badge" id="badge"></div>

<button class="restart" id="restartBtn" onclick="start()" style="display:none;">
Mulai Ulang
</button>

</div>

<script>

const vocab=[
  ["のります", "naik (kendaraan)"],
  ["おります", "turun (kendaraan)"],
  ["のりかえます", "ganti/pindah (kendaraan)"],
  ["あびます", "mandi (shower)"],
  ["いれます", "memasukkan"],
  ["だします", "mengeluarkan/menyerahkan"],
  ["おろします", "mengambil (uang di bank)"],
  ["はいります", "masuk (universitas)"],
  ["でます", "lulus/keluar (universitas)"],
  ["おします", "menekan/mendorong"],
  ["のみます", "minum (obati/alkohol)"],
  ["はじめます", "memulai"],
  ["けんがくします", "melakukan studi banding/observasi"],
  ["でんわします", "menelepon"],
  ["わかい", "muda"],
  ["ながい", "panjang"],
  ["みじかい", "pendek"],
  ["あかるい", "terang/cerah"],
  ["くらい", "gelap"],
  ["からだ", "badan/tubuh"],
  ["あたま", "kepala"],
  ["かみ", "rambut"],
  ["かお", "wajah"],
  ["め", "mata"],
  ["みみ", "telinga"],
  ["はな", "hidung"],
  ["くち", "mulut"],
  ["は", "gigi"],
  ["おなか", "perut"],
  ["あし", "kaki"],
  ["せ", "tinggi badan"],
  ["サービス", "pelayanan/servis"],
  ["ジョギング", "jogging"],
  ["シャワー", "shower"],
  ["みどり", "hijau/pepohonan"],
  ["おてら", "candi/kuil Buddha"],
  ["じんじゃ", "kuil Shinto"],
  ["～ばん", "nomor ～"],
  ["どうやって", "dengan cara bagaimana"],
  ["どの～", "～ yang mana"],
  ["どれ", "yang mana (3 benda/lebih)"],
  ["すごいですね", "hebat ya"],
  ["まだまだです", "masih belum (rendah hati)"],
  ["おひきだしですか", "mau ambil uang?"],

  // Bab 17
  ["おぼえます", "mengingat/menghafal"],
  ["わすれます", "lupa"],
  ["なくします", "hilang/menghilangkan"],
  ["はらいます", "membayar"],
  ["かえします", "mengembalikan"],
  ["でかけます", "pergi keluar"],
  ["ぬぎます", "melepas (pakaian/sepatu)"],
  ["もっていきます", "membawa pergi"],
  ["もってきます", "membawa datang"],
  ["しんぱいします", "khawatir"],
  ["ざんぎょうします", "lembur"],
  ["しゅっちょうします", "dinas luar kota"],
  ["たいせつ", "penting/berharga"],
  ["だいじょうぶ", "tidak apa-apa"],
  ["あぶない", "bahaya"],
  ["きんえん", "dilarang merokok"],
  ["ほけんしょう", "kartu asuransi"],
  ["ねつ", "demam"],
  ["びょうき", "sakit/penyakit"],
  ["くすり", "obat"],
  ["おふろ", "bak mandi"],
  ["うわぎ", "jaket/pakaian luar"],
  ["したぎ", "pakaian dalam"],
  ["に、さんにち", "2 atau 3 hari"],
  ["～までに", "paling lambat sebelum ～"],
  ["ですから", "oleh karena itu"],
  ["どうしましたか", "ada apa/kenapa?"],
  ["のど", "tenggorokan"],
  ["いたい", "sakit"],
  ["かぜ", "masuk angin/flu"],
  ["おだいじに", "semoga lekas sembuh"],

  // Bab 18
  ["できます", "bisa/dapat"],
  ["あらいます", "mencuci"],
  ["ひきます", "memainkan (alat musik petik/tuts)"],
  ["うたいます", "menyanyi"],
  ["あつめます", "mengumpulkan"],
  ["すてます", "membuang"],
  ["かえます", "menukar/mengubah"],
  ["うんてんします", "mengemudi/menyetir"],
  ["よやくします", "memesan/reservasi"],
  ["ピアノ", "piano"],
  ["～メートル", "～ meter"],
  ["げんきん", "uang tunai"],
  ["しゅみ", "hobi"],
  ["にっき", "buku harian"],
  ["おいのり", "doa/sembahyang"],
  ["かちょう", "kepala bagian"],
  ["ぶちょう", "kepala divisi/manajer"],
  ["しゃちょう", "direktur utama"],
  ["どうぶつ", "hewan/binatang"],
  ["うま", "kuda"],
  ["インターネット", "internet"],
  ["とくに", "terutama/khususnya"],
  ["へえ", "masa? (ungkapan terkejut)"],
  ["それはおもしろいですね", "itu menarik ya"],
  ["なかなか", "cukup sulit (diikuti bentuk negatif)"],
  ["ほんとうですか", "apakah benar?"],
  ["ぜひ", "pasti/sangat ingin"],

  // Bab 19
  ["のぼります", "mendaki (gunung)"],
  ["とまります", "menginap"],
  ["そうじします", "membersihkan"],
  ["せんたくします", "mencuci pakaian"],
  ["なります", "menjadi"],
  ["ねむい", "mengantuk"],
  ["つよい", "kuat"],
  ["よわい", "lemah"],
  ["れんしゅう", "latihan"],
  ["ゴルフ", "golf"],
  ["すもう", "gulat sumo"],
  ["おちゃ", "upacara minum teh"],
  ["ひ", "hari/tanggal"],
  ["ちょうし", "kondisi (tubuh/mesin)"],
  ["いちど", "satu kali"],
  ["いちども", "sekali pun tidak (diikuti bentuk negatif)"],
  ["だんだん", "lama-kelamaan/berangsur-angsur"],
  ["もうすぐ", "sebentar lagi"],
  ["おかげさまで", "berkat doa/bantuan Anda"],
  ["かんぱい", "tos!/bersulang"],
  ["ダイエット", "diet"],
  ["むり", "mustahil/berlebihan"],
  ["からだにいい", "baik untuk tubuh"],

  // Bab 20
  ["いります", "memerlukan/butuh"],
  ["しらべます", "memeriksa/menyelidiki"],
  ["しゅうりします", "memperbaiki"],
  ["ぼく", "aku (digunakan laki-laki kasual)"],
  ["きみ", "kamu (kasual)"],
  ["～くん", "sapaan kasual untuk teman laki-laki"],
  ["うん", "ya (kasual)"],
  ["うーん", "tidak (kasual)"],
  ["ことば", "kata/bahasa"],
  ["きもの", "pakaian tradisional kimono"],
  ["ビザ", "visa"],
  ["はじめ", "permulaan/awal"],
  ["おわり", "akhir/selesai"],
  ["こっち", "sebelah sini (kasual)"],
  ["そっち", "sebelah situ (kasual)"],
  ["あっち", "sebelah sana (kasual)"],
  ["どっち", "sebelah mana (kasual)"],
  ["みんなで", "bersama-sama"],
  ["～けど", "～ tetapi (kasual)"],
  ["おなかがいっぱいです", "perut kenyang"],
  ["よかったら", "kalau tidak keberatan"],
  ["いろいろ", "bermacam-macam"]
];

let q=[],cur=0,xp=0,streak=0;
let correct=0;
let wrong=0;
let wrongList=[];
let firstWrong=null;
let perfectCorrect=0;

function shuffle(a){
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
}

function updateUI(){

document.getElementById("score").textContent=xp+" XP";
document.getElementById("streak").textContent="x "+streak;

const progress=(perfectCorrect/q.length)*100;
document.getElementById("progressBar").style.width=progress+"%";

document.getElementById("qNumber").textContent=(cur+1)+" / "+q.length;

}

function loadQuestion(){

if(cur>=q.length){
finish();
return;
}

firstWrong=null;

const [indo,jp]=q[cur];

document.getElementById("question").textContent=indo;
document.getElementById("result").textContent="";
document.getElementById("badge").textContent="";

const ops=new Set([jp]);

while(ops.size<4){
ops.add(vocab[Math.floor(Math.random()*vocab.length)][1]);
}

document.getElementById("options").innerHTML="";

[...ops].sort(()=>Math.random()-0.5).forEach(o=>{
const b=document.createElement("button");
b.textContent=o;
b.onclick=()=>check(o,jp,indo);
document.getElementById("options").appendChild(b);
});

updateUI();
}

function check(sel,ans,indo){

if(sel===ans){

streak++;
correct++;

let bonus=streak>=5?5:2;
xp+=bonus;

if(streak==5){
document.getElementById("badge").textContent="🏆 COMBO x5";
}

document.getElementById("result").textContent="BENAR +"+bonus+"XP";

if(!firstWrong){
perfectCorrect++;
}

if(firstWrong){
wrongList.push({
q:indo,
your:firstWrong,
correct:ans
});
}

cur++;

updateUI();

setTimeout(loadQuestion,500);

}else{

streak=0;

if(!firstWrong){
firstWrong=sel;
wrong++;
}

document.getElementById("result").textContent="SALAH";

}

}

function finish(){

document.getElementById("options").innerHTML="";
document.getElementById("result").textContent="";
document.getElementById("badge").textContent="";

let html=`
<div class="result-box">

<div class="result-header">
<h2>Quiz Selesai 🎉</h2>
<p>Lihat progres belajarmu</p>
</div>
`;

if(wrongList.length>0){

html+=`
<table class="review-table">
<tr>
<th>Soal</th>
<th>Jawaban Kamu</th>
<th>Jawaban Benar</th>
</tr>
`;

wrongList.forEach(i=>{
html+=`
<tr>
<td>${i.q}</td>
<td class="wrong">${i.your}</td>
<td class="correct">${i.correct}</td>
</tr>
`;
});

html+=`</table>`;

}else{

html+=`<p style="text-align:center;font-weight:700;color:#2e7d32;">Semua jawaban benar! 🔥</p>`;

}

html+=`</div>`;

document.querySelector(".card").innerHTML=html;

document.getElementById("progressBar").style.width="100%";

document.getElementById("restartBtn").style.display="block";

}

function start(){

q=[...vocab];
shuffle(q);

cur=0;
xp=0;
streak=0;

correct=0;
wrong=0;
perfectCorrect=0;

wrongList=[];

document.querySelector(".card").innerHTML='<div id="question">?</div>';

document.getElementById("restartBtn").style.display="none";

loadQuestion();

}

start();

</script>

</body>
</html>
